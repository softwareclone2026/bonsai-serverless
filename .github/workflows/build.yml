name: Build and push Bonsai serverless worker

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "Dockerfile"
      - "handler.py"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CUDA devel イメージ + ビルド成果物で 30GB 近く使うため先に空ける。
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost \
                      /usr/share/swift \
                      /opt/az \
                      /usr/local/.ghcup \
                      /usr/lib/jvm \
                      /usr/local/share/powershell \
                      /usr/share/miniconda
          sudo docker image prune -af || true
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          OWNER_LC=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=${GITHUB_SHA:0:7}
          {
            echo "value<<__TAGS__"
            echo "ghcr.io/$OWNER_LC/bonsai-serverless:latest"
            echo "ghcr.io/$OWNER_LC/bonsai-serverless:$SHORT_SHA"
            echo "__TAGS__"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha
